<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人日程表</title>
  <link rel="icon" type="image/png" href="../public/icon/icon.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f9f8ff;
      --panel: #ffffff;
      --ink: #26303a;
      --muted: #73808c;
      --line: #e6eaf0;
      --line-soft: #f0f3f7;
      --blue: #9fd7ff;
      --blue-deep: #4f9fd7;
      --blue-ink: #174c72;
      --pink: #ffc1d8;
      --pink-deep: #e27aa4;
      --pink-ink: #7d2e52;
      --done-yellow: #ffe99f;
      --done-yellow-deep: #eac75f;
      --done-yellow-ink: #6b531c;
      --done: #b9c2ce;
      --danger: #c95f75;
      --shadow: 0 14px 40px rgba(38, 48, 58, 0.1);
      --soft-shadow: 0 10px 24px rgba(38, 48, 58, 0.08);
      --hour-height: 72px;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      position: relative;
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 16%, rgba(159, 215, 255, 0.46), transparent 34%),
        radial-gradient(circle at 82% 18%, rgba(255, 193, 216, 0.48), transparent 34%),
        radial-gradient(circle at 50% 88%, rgba(205, 238, 255, 0.58), transparent 38%),
        linear-gradient(135deg, #eff8ff 0%, #fff3fa 48%, #eef7ff 100%),
        var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    body::before {
      content: none;
    }

    body::after {
      content: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 233, 159, 0.95) 0 2px, transparent 3px),
        radial-gradient(circle at 22% 28%, rgba(255, 255, 255, 0.92) 0 1px, transparent 2px),
        radial-gradient(circle at 76% 10%, rgba(255, 233, 159, 0.88) 0 2px, transparent 3px),
        radial-gradient(circle at 88% 24%, rgba(255, 255, 255, 0.9) 0 1px, transparent 2px),
        radial-gradient(circle at 62% 38%, rgba(159, 215, 255, 0.68) 0 2px, transparent 3px),
        radial-gradient(circle at 16% 72%, rgba(255, 193, 216, 0.62) 0 2px, transparent 3px);
    }

    body::after {
      content: "";
      position: fixed;
      right: max(24px, 5vw);
      bottom: 24px;
      width: min(260px, 42vw);
      aspect-ratio: 1;
      z-index: -1;
      pointer-events: none;
      opacity: 0.38;
      background:
        radial-gradient(circle at 52% 60%, rgba(255, 233, 159, 0.95) 0 35%, transparent 36%),
        radial-gradient(circle at 44% 28%, rgba(64, 73, 91, 0.8) 0 5%, transparent 5.5%),
        linear-gradient(18deg, transparent 44%, rgba(226, 122, 164, 0.68) 45% 49%, transparent 50%),
        radial-gradient(ellipse at 49% 45%, rgba(64, 73, 91, 0.78) 0 8%, transparent 8.5%);
      filter: blur(0.1px);
    }

    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      position: relative;
      z-index: 1;
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .date {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      min-width: 86px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      text-align: center;
      box-shadow: 0 8px 20px rgba(38, 48, 58, 0.06);
    }

    .pill strong {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .pill span {
      color: var(--muted);
      font-size: 12px;
    }

    .backend-status {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 16px;
      padding: 10px 12px;
      border: 1px solid rgba(159, 215, 255, 0.5);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: var(--soft-shadow);
      color: var(--blue-ink);
      font-size: 13px;
    }

    .backend-status.show { display: flex; }

    .backend-status button {
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--blue-deep), #78bff0);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      padding: 7px 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .left-stack, .right-stack {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .quote-panel, .history-panel {
      padding: 18px;
    }

    .quote-panel h2, .history-panel h2, .list-panel h2, .memo-panel h2, .timeline-panel h2 {
      margin: 0;
      font-size: 18px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fcfdff;
      color: var(--ink);
      outline: none;
      padding: 11px 12px;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      border-color: var(--blue-deep);
      box-shadow: 0 0 0 3px rgba(159, 215, 255, 0.45);
    }

    .duration-row {
      display: grid;
      grid-template-columns: 1fr 104px;
      gap: 10px;
      align-items: end;
    }

    .primary, .secondary, .danger-btn {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      padding: 11px 14px;
      transition: background 0.18s, color 0.18s, transform 0.18s, border-color 0.18s;
    }

    .primary {
      width: 100%;
      margin-top: 16px;
      background: linear-gradient(135deg, var(--blue-deep), #78bff0);
      color: #ffffff;
    }

    .primary:hover { background: linear-gradient(135deg, #3e91c9, #64b2e8); }

    .secondary {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
    }

    .secondary:hover {
      border-color: var(--blue-deep);
      color: var(--blue-ink);
    }

    .danger-btn {
      background: rgba(201, 95, 117, 0.1);
      color: var(--danger);
    }

    .danger-btn:hover { background: rgba(201, 95, 117, 0.16); }
    .primary:active, .secondary:active, .danger-btn:active { transform: translateY(1px); }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .tasks {
      display: grid;
      gap: 0;
      padding: 0;
      margin: 0;
      list-style: none;
      max-height: 330px;
      overflow: auto;
    }

    .task {
      position: relative;
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      align-items: start;
      border-left: 5px solid transparent;
      overflow: hidden;
    }

    .task:last-child { border-bottom: 0; }
    .task.blue { border-left-color: var(--blue-deep); background: linear-gradient(90deg, rgba(159, 215, 255, 0.18), transparent 42%); }
    .task.pink { border-left-color: var(--pink-deep); background: linear-gradient(90deg, rgba(255, 193, 216, 0.22), transparent 42%); }
    .task.important { box-shadow: inset 0 0 0 1px rgba(234, 199, 95, 0.34); }

    .checkbox {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      border: 2px solid var(--blue-deep);
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-size: 15px;
      line-height: 1;
    }

    .task.pink .checkbox { border-color: var(--pink-deep); }
    .task.done .checkbox {
      background: linear-gradient(135deg, var(--blue), var(--pink));
      border-color: rgba(226, 122, 164, 0.48);
      color: var(--pink-ink);
      font-weight: 800;
    }

    .time {
      display: inline-block;
      margin-bottom: 5px;
      color: var(--blue-ink);
      font-size: 13px;
      font-weight: 700;
    }

    .task.pink .time { color: var(--pink-ink); }

    .title {
      margin: 0;
      font-weight: 700;
      line-height: 1.38;
      overflow-wrap: anywhere;
    }

    .note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .task.done {
      background:
        radial-gradient(circle at 90% 24%, rgba(255, 193, 216, 0.52) 0 6px, transparent 7px),
        linear-gradient(90deg, rgba(159, 215, 255, 0.22), rgba(255, 193, 216, 0.24) 58%, transparent);
    }

    .task.done::after {
      content: "✿";
      position: absolute;
      right: 86px;
      top: 13px;
      color: var(--pink-deep);
      font-size: 17px;
      pointer-events: none;
      opacity: 0.88;
    }

    .task-actions { display: flex; gap: 6px; }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .edit { color: var(--blue-ink); }
    .delete { color: var(--danger); font-size: 20px; }
    .icon-btn:hover { border-color: rgba(79, 159, 215, 0.22); background: rgba(159, 215, 255, 0.16); }
    .delete:hover { border-color: rgba(201, 95, 117, 0.24); background: rgba(255, 193, 216, 0.24); }

    .empty {
      padding: 42px 18px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 18px;
    }

    .memo-body {
      padding: 16px 18px 18px;
    }

    .memo-open {
      width: 100%;
      min-height: 92px;
      border: 1px dashed rgba(79, 159, 215, 0.32);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(159, 215, 255, 0.14), rgba(255, 193, 216, 0.16)),
        #fcfdff;
      color: var(--muted);
      cursor: text;
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
      font-weight: 700;
      transition: border-color 0.18s, box-shadow 0.18s, color 0.18s;
    }

    .memo-open:hover {
      border-color: rgba(226, 122, 164, 0.42);
      box-shadow: var(--soft-shadow);
      color: var(--ink);
    }

    .memo-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .memo-card {
      border: 1px solid rgba(159, 215, 255, 0.24);
      border-left: 5px solid var(--blue-deep);
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(159, 215, 255, 0.15), rgba(255, 193, 216, 0.12));
      padding: 12px 14px;
      box-shadow: 0 8px 20px rgba(38, 48, 58, 0.06);
    }

    .memo-card:nth-child(even) {
      border-left-color: var(--pink-deep);
    }

    .memo-meta {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .memo-text {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .timeline-wrap { padding: 16px 18px 18px; }

    .timeline-shell {
      position: relative;
      min-height: calc(18 * var(--hour-height));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fcfdff;
      overflow: visible;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92);
    }

    .hour-row {
      position: absolute;
      left: 0;
      right: 0;
      height: var(--hour-height);
      border-top: 1px solid var(--line-soft);
      display: grid;
      grid-template-columns: 68px 1fr;
      pointer-events: none;
    }

    .hour-row:first-child { border-top: 0; }

    .hour-label {
      color: var(--muted);
      font-size: 12px;
      padding: 8px 10px 0 0;
      text-align: right;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.64);
    }

    .hour-area {
      background:
        linear-gradient(to bottom, transparent calc(50% - 0.5px), rgba(230, 234, 240, 0.74) calc(50% - 0.5px), rgba(230, 234, 240, 0.74) calc(50% + 0.5px), transparent calc(50% + 0.5px));
    }

    .timeline-click-layer, .event-layer {
      position: absolute;
      inset: 0 0 0 68px;
    }

    .timeline-click-layer { cursor: crosshair; }
    .event-layer { pointer-events: none; }

    .event-block {
      position: absolute;
      left: 12px;
      right: 12px;
      min-height: 38px;
      padding: 10px 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      color: #1d3648;
      box-shadow: var(--soft-shadow);
      cursor: grab;
      overflow: visible;
      pointer-events: auto;
      user-select: none;
      touch-action: none;
    }

    .event-block:hover,
    .event-block:focus {
      z-index: 30;
    }

    .event-block:active { cursor: grabbing; }
    .event-block.blue { background: linear-gradient(135deg, #cdeeff, var(--blue)); border: 1px solid rgba(79, 159, 215, 0.28); }
    .event-block.pink { background: linear-gradient(135deg, #ffe0eb, var(--pink)); border: 1px solid rgba(226, 122, 164, 0.28); color: #603149; }
    .event-block.important { box-shadow: 0 12px 26px rgba(234, 199, 95, 0.22), var(--soft-shadow); }
    .event-block.done {
      background: linear-gradient(135deg, #fff8cc, var(--done-yellow)) !important;
      border-color: rgba(234, 199, 95, 0.78) !important;
      color: var(--done-yellow-ink) !important;
      box-shadow: 0 14px 30px rgba(234, 199, 95, 0.34);
    }

    .event-block.done::before {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .event-block.done::before {
      content: "";
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle at 76% 18%, rgba(255, 255, 255, 0.95) 0 2px, transparent 3px),
        radial-gradient(circle at 83% 24%, rgba(226, 122, 164, 0.82) 0 3px, transparent 4px),
        radial-gradient(circle at 90% 30%, rgba(79, 159, 215, 0.72) 0 3px, transparent 4px),
        radial-gradient(circle at 80% 44%, rgba(255, 255, 255, 0.8) 0 2px, transparent 3px),
        radial-gradient(circle at 92% 56%, rgba(226, 122, 164, 0.7) 0 2px, transparent 3px),
        radial-gradient(circle at 72% 62%, rgba(255, 193, 216, 0.72) 0 5px, transparent 6px),
        linear-gradient(130deg, transparent 0 54%, rgba(255, 255, 255, 0.38) 55% 57%, transparent 58%);
      opacity: 0.95;
    }

    .event-content,
    .event-block.done .event-title,
    .event-block.done .event-note,
    .event-block.done .event-time {
      position: relative;
      z-index: 1;
    }

    .event-content {
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
    }

    .event-title {
      display: block;
      font-weight: 800;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-time, .event-note {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.25;
      opacity: 0.88;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-note {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .resize-handle {
      position: absolute;
      left: 0;
      right: 0;
      height: 10px;
      cursor: ns-resize;
    }

    .resize-top { top: 0; }
    .resize-bottom { bottom: 0; }

    .timeline-tooltip {
      position: fixed;
      z-index: 1000;
      width: min(300px, calc(100vw - 32px));
      padding: 12px 14px;
      border: 1px solid rgba(159, 215, 255, 0.34);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(239, 248, 255, 0.97), rgba(255, 243, 250, 0.97)),
        #ffffff;
      box-shadow: 0 18px 40px rgba(31, 45, 61, 0.16);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-50%) translateX(-4px);
      transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s ease;
    }

    .timeline-tooltip.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(-50%);
    }

    .celebration {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      pointer-events: none;
      overflow: hidden;
    }

    .celebration.show {
      display: grid;
    }

    .celebration-message {
      position: relative;
      z-index: 2;
      padding: 14px 20px;
      border: 1px solid rgba(159, 215, 255, 0.34);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(239, 248, 255, 0.96), rgba(255, 243, 250, 0.96)),
        #ffffff;
      box-shadow: 0 20px 54px rgba(38, 48, 58, 0.18);
      color: var(--ink);
      font-size: 18px;
      font-weight: 800;
      animation: celebrate-pop 1.8s ease forwards;
    }

    .confetti {
      position: absolute;
      top: -16px;
      width: 9px;
      height: 16px;
      border-radius: 4px;
      background: var(--blue);
      opacity: 0;
      animation: confetti-fall 1.9s ease-out forwards;
    }

    .confetti:nth-child(3n) { background: var(--pink); }
    .confetti:nth-child(4n) { background: var(--done-yellow); }
    .confetti:nth-child(5n) { width: 12px; height: 12px; border-radius: 999px; }

    @keyframes confetti-fall {
      0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(0deg); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--drift), 105vh, 0) rotate(520deg); }
    }

    @keyframes celebrate-pop {
      0% { opacity: 0; transform: translateY(16px) scale(0.94); }
      14% { opacity: 1; transform: translateY(0) scale(1); }
      78% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-10px) scale(0.98); }
    }

    .quote-card {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid rgba(79, 159, 215, 0.2);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(159, 215, 255, 0.28), rgba(255, 193, 216, 0.24)),
        #ffffff;
      box-shadow: var(--soft-shadow);
    }

    .quote-text {
      margin: 0;
      color: var(--ink);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.55;
    }

    .quote-source {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .quote-date {
      margin: 12px 0 0;
      color: var(--blue-ink);
      font-size: 12px;
      font-weight: 700;
    }

    .history-controls {
      display: grid;
      grid-template-columns: 1fr 86px;
      gap: 10px;
      margin-top: 14px;
    }

    .history-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .mini-stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 8px;
      background: #fcfdff;
      text-align: center;
    }

    .mini-stat strong {
      display: block;
      font-size: 18px;
    }

    .mini-stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .calendar {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .weekday, .day-cell {
      min-height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      font-size: 12px;
    }

    .weekday {
      color: var(--muted);
      font-weight: 700;
    }

    .day-cell {
      border: 1px solid var(--line);
      background: #ffffff;
      cursor: pointer;
      position: relative;
      color: var(--ink);
    }

    .day-cell.muted {
      color: #b3bbc4;
      background: #f7f9fb;
    }

    .day-cell.has-data {
      background: linear-gradient(135deg, rgba(159, 215, 255, 0.35), rgba(255, 193, 216, 0.34));
      border-color: rgba(79, 159, 215, 0.26);

      .timeline-shell { min-width: 620px; }

  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>个人日程表</h1>

      <div class="daily-reminder-actions">

  <div class="timeline-tooltip" id="timelineTooltip" role="tooltip"></div>
  <div class="celebration" id="celebration" aria-live="polite"></div>

  <script>
    const DAY_START = 6 * 60;
    const DAY_END = 24 * 60;
    const HOUR_HEIGHT = 72;
    const SNAP_MINUTES = 15;
    const DEFAULT_DURATION = 60;
    const STORAGE_PREFIX = "daily-schedule:";
    const MEMO_STORAGE_PREFIX = "daily-memos:";
    const QUOTE_STORAGE_PREFIX = "daily-quote:";
    const DAILY_REMINDER_TRIGGER_KEY = "daily-reminder-triggered-date";
    const QUOTE_ENDPOINT = "https://v1.hitokoto.cn/?encode=json&c=d&c=h&c=i";
    const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];

    const list = document.querySelector("#taskList");
    const selectedDateText = document.querySelector("#selectedDateText");
    const dailyQuoteText = document.querySelector("#dailyQuoteText");
    const dailyQuoteSource = document.querySelector("#dailyQuoteSource");
    const dailyQuoteDate = document.querySelector("#dailyQuoteDate");
    const backendStatus = document.querySelector("#backendStatus");
    const backendStatusText = document.querySelector("#backendStatusText");
    const backendRetryButton = document.querySelector("#backendRetryButton");
    const statusText = document.querySelector("#statusText");
    const memoStatusText = document.querySelector("#memoStatusText");
    const openMemoButton = document.querySelector("#openMemoButton");
    const memoList = document.querySelector("#memoList");
    const totalCount = document.querySelector("#totalCount");
    const openCount = document.querySelector("#openCount");
    const doneCount = document.querySelector("#doneCount");
    const hourRows = document.querySelector("#hourRows");
    const timelineClickLayer = document.querySelector("#timelineClickLayer");
    const eventLayer = document.querySelector("#eventLayer");
    const monthPicker = document.querySelector("#monthPicker");
    const yearPicker = document.querySelector("#yearPicker");
    const calendarGrid = document.querySelector("#calendarGrid");
    const todayButton = document.querySelector("#todayButton");
    const monthTotal = document.querySelector("#monthTotal");
    const monthDone = document.querySelector("#monthDone");
    const monthDuration = document.querySelector("#monthDuration");
    const yearTotal = document.querySelector("#yearTotal");
    const yearDone = document.querySelector("#yearDone");
    const yearDuration = document.querySelector("#yearDuration");
    const yearBars = document.querySelector("#yearBars");
    const modalBackdrop = document.querySelector("#modalBackdrop");
    const modalForm = document.querySelector("#taskModalForm");
    const modalTitle = document.querySelector("#modalTitle");
    const modalActions = document.querySelector("#modalActions");
    const modalTaskId = document.querySelector("#modalTaskId");
    const modalTime = document.querySelector("#modalTime");
    const modalDuration = document.querySelector("#modalDuration");
    const modalDurationText = document.querySelector("#modalDurationText");
    const modalTaskTitle = document.querySelector("#modalTaskTitle");
    const modalNote = document.querySelector("#modalNote");
    const modalDoneToggle = document.querySelector("#modalDoneToggle");
    const modalDelete = document.querySelector("#modalDelete");
    const closeModal = document.querySelector("#closeModal");
    const timelineTooltip = document.querySelector("#timelineTooltip");
    const memoBackdrop = document.querySelector("#memoBackdrop");
    const memoForm = document.querySelector("#memoForm");
    const memoText = document.querySelector("#memoText");
    const closeMemoModal = document.querySelector("#closeMemoModal");
    const clearMemoButton = document.querySelector("#clearMemoButton");
    const celebration = document.querySelector("#celebration");
    const dailyReminderBackdrop = document.querySelector("#dailyReminderBackdrop");
    const dailyReminderTitle = document.querySelector("#dailyReminderTitle");
    const dailyReminderText = document.querySelector("#dailyReminderText");
    const dailyReminderYes = document.querySelector("#dailyReminderYes");
    const dailyReminderNo = document.querySelector("#dailyReminderNo");
    const dailyReminderClose = document.querySelector("#dailyReminderClose");

    let selectedDateKey = new Date().toLocaleDateString("sv-SE");
    let tasks = migrateTasks(loadTasks(selectedDateKey));
    let memos = loadMemos(selectedDateKey);
    let activePointer = null;
    let quoteRequestId = 0;
    let lastAllDoneKey = allTasksDone() ? selectedDateKey : "";
    let backendReady = false;
    let reminderQueue = Promise.resolve();
    let taskModalResolver = null;
    const sessionId = getSessionId();
    let heartbeatTimer = null;
    let dailyReminderQueueStarted = false;
    let dailyReminderDateKey = selectedDateKey;

    monthPicker.value = selectedDateKey.slice(0, 7);
    yearPicker.value = selectedDateKey.slice(0, 4);

    bindDuration(modalDuration, modalDurationText);
    init();

    async function init() {
      applyLaunchDate();
      renderHours();
      saveTasks();
      render();
      checkBackendReadiness();
      handleLaunchAction();
    }

    function showBackendStatus(message, canRetry = false) {
      backendStatusText.textContent = message;
      backendRetryButton.hidden = !canRetry;
      backendStatus.classList.add("show");
    }

    function hideBackendStatus() {
      backendStatus.classList.remove("show");
    }

    async function checkBackendReadiness(maxAttempts = 8) {
      showBackendStatus("正在启动本地服务...", false);
      for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
        try {
          const response = await fetch("/api/health", { cache: "no-store" });
          if (response.ok) {
            backendReady = true;
            hideBackendStatus();
            await hydrateSelectedDateFromBackend();
            render();
            startSessionHeartbeat();
            runDailyReminderQueue();
            return true;
          }
        } catch {
          // The retry loop below handles startup races and offline/static mode.
        }
        await wait(Math.min(300 + attempt * 150, 1000));
      }
      backendReady = false;
      showBackendStatus("本地服务暂时未连接，普通日程可继续使用。", true);
      return false;
    }

    function wait(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    function withTimeout(promise, milliseconds, fallback) {
      let timer = null;
      const timeout = new Promise((resolve) => {
        timer = setTimeout(() => resolve(fallback), milliseconds);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    function getSessionId() {
      const key = "daily-schedule-session-id";
      const existing = sessionStorage.getItem(key);
      if (existing) return existing;
      const next = createId();
      sessionStorage.setItem(key, next);
      return next;
    }

    function startSessionHeartbeat() {
      if (heartbeatTimer || !backendReady) return;
      sendSessionHeartbeat();
      heartbeatTimer = setInterval(sendSessionHeartbeat, 5000);
    }

    async function sendSessionHeartbeat() {
      if (!backendReady) return;
      try {
        await fetch("/api/session/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sessionId,
            date: selectedDateKey,
            visibility: document.visibilityState
          })
        });
      } catch {
        backendReady = false;
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        heartbeatTimer = null;
        showBackendStatus("本地服务连接中断，普通日程已保存在浏览器中。", true);
      }
    }

    async function runDailyReminderQueue() {
      if (!backendReady || dailyReminderQueueStarted) return;
      const todayKey = new Date().toLocaleDateString("sv-SE");
      if (localStorage.getItem(DAILY_REMINDER_TRIGGER_KEY) === todayKey) return;
      dailyReminderQueueStarted = true;
      dailyReminderDateKey = todayKey;
      try {
        const response = await fetch(`/api/reminders/daily?date=${encodeURIComponent(todayKey)}`, { cache: "no-store" });
        if (!response.ok) return;
        const data = await response.json();
        localStorage.setItem(DAILY_REMINDER_TRIGGER_KEY, todayKey);
        for (const reminder of data.reminders || []) {
          enqueueReminder(async () => {
            const result = await withTimeout(handleDailyReminder(reminder), 120000, "timeout");
            if (result === "timeout") {
              dailyReminderBackdrop.classList.remove("open");
              if (taskModalResolver) {
                const resolver = taskModalResolver;
                taskModalResolver = null;
                resolver("closed");
              }
              await completeDailyReminder(reminder.key, "closed");
            }
            return result;
          });
        }
      } catch {
        // Daily reminders should never block the normal schedule page.
        dailyReminderQueueStarted = false;
      }
    }

    function enqueueReminder(task) {
      reminderQueue = reminderQueue
        .then(task)
        .catch(() => "error");
      return reminderQueue;
    }

    async function handleDailyReminder(reminder) {
      if (reminder.type === "sport-habit") {
        const choice = await showDailyChoice({
          title: "每日运动确认",
          text: "是否需要将今天的运动计划记录到日程？",
          yes: "是",
          no: "否"
        });
        if (choice === "yes") {
          const result = await openSportTaskFromReminder();
          await completeDailyReminder(reminder.key, result === "saved" ? "done" : "closed");
          return result;
        }
        await completeDailyReminder(reminder.key, choice === "no" ? "skipped" : "closed");
        return choice;
      }

      if (reminder.type === "important-schedule") {
        const choice = await showDailyChoice({
          title: "重要日程确认",
          text: "今天有重要日程需要记录吗？",
          yes: "有",
          no: "无"
        });
        if (choice === "yes") {
          const result = await openImportantTaskFromReminder();
          await completeDailyReminder(reminder.key, result === "saved" ? "done" : "closed");
          return result;
        }
        await completeDailyReminder(reminder.key, choice === "no" ? "skipped" : "closed");
        return choice;
      }

      if (reminder.type === "github-maintenance") {
        const choice = await showDailyChoice({
          title: "GitHub 维护提醒",
          text: reminder.text,
          yes: "知道了",
          no: "跳过"
        });
        await completeDailyReminder(reminder.key, choice === "yes" ? "done" : "skipped");
        return choice;
      }

      return "skipped";
    }

    async function completeDailyReminder(key, status) {
      if (!backendReady) return;
      try {
        await fetch("/api/reminders/daily/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date: dailyReminderDateKey, key, status })
        });
      } catch {
        // State persistence is best-effort; the queue still keeps moving.
      }
    }

    function showDailyChoice({ title, text, yes, no }) {
      return new Promise((resolve) => {
        let done = false;
        dailyReminderTitle.textContent = title;
        dailyReminderText.textContent = text;
        dailyReminderYes.textContent = yes;
        dailyReminderNo.textContent = no;
        dailyReminderBackdrop.classList.add("open");

        const finish = (value) => {
          if (done) return;
          done = true;
          dailyReminderBackdrop.classList.remove("open");
          dailyReminderYes.removeEventListener("click", onYes);
          dailyReminderNo.removeEventListener("click", onNo);
          dailyReminderClose.removeEventListener("click", onClose);
          resolve(value);
        };
        const onYes = () => finish("yes");
        const onNo = () => finish("no");
        const onClose = () => finish("closed");

        dailyReminderYes.addEventListener("click", onYes);
        dailyReminderNo.addEventListener("click", onNo);
        dailyReminderClose.addEventListener("click", onClose);
      });
    }

    function openImportantTaskFromReminder() {
      if (selectedDateKey !== dailyReminderDateKey) switchDate(dailyReminderDateKey);
      openModal(null, null, { blankTime: true, important: true });
      modalTaskTitle.value = "";
      modalNote.value = "重要事项";
      return new Promise((resolve) => {
        taskModalResolver = resolve;
      });
    }

    function openSportTaskFromReminder() {
      if (selectedDateKey !== dailyReminderDateKey) switchDate(dailyReminderDateKey);
      openModal(null, null, { blankTime: true });
      modalTaskTitle.value = "";
      modalNote.value = "";
      return new Promise((resolve) => {
        taskModalResolver = resolve;
      });
    }

    function applyLaunchDate() {
      const params = new URLSearchParams(window.location.search);
      const date = params.get("date");
      if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      selectedDateKey = date;
      tasks = migrateTasks(loadTasks(selectedDateKey));
      memos = loadMemos(selectedDateKey);
      lastAllDoneKey = allTasksDone() ? selectedDateKey : "";
      monthPicker.value = selectedDateKey.slice(0, 7);
      yearPicker.value = selectedDateKey.slice(0, 4);
    }

    function handleLaunchAction() {
      const params = new URLSearchParams(window.location.search);
      const action = params.get("action");
      if (action === "new-task") {
        const start = parseTime(params.get("time")) ?? 9 * 60;
        openModal(null, start);
        modalTaskTitle.value = params.get("title") || "";
        modalNote.value = params.get("note") || params.get("category") || "";
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      if (action === "memo") {
        openMemoModal();
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function keyFor(dateKey) {
      return `${STORAGE_PREFIX}${dateKey}`;
    }

    function memoKeyFor(dateKey) {
      return `${MEMO_STORAGE_PREFIX}${dateKey}`;
    }

    function loadTasks(dateKey) {
      try {
        return JSON.parse(localStorage.getItem(keyFor(dateKey))) || [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(keyFor(selectedDateKey), JSON.stringify(tasks));
    }

    function loadMemos(dateKey) {
      try {
        return JSON.parse(localStorage.getItem(memoKeyFor(dateKey))) || [];
      } catch {
        return [];
      }
    }

    function saveMemos() {
      localStorage.setItem(memoKeyFor(selectedDateKey), JSON.stringify(memos));
    }

    function getAllDailyData() {
      const data = {};
      for (let index = 0; index < localStorage.length; index += 1) {
        const key = localStorage.key(index);
        if (!key || !key.startsWith(STORAGE_PREFIX)) continue;
        const dateKey = key.slice(STORAGE_PREFIX.length);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) continue;
        data[dateKey] = migrateTasks(loadTasks(dateKey));
      }
      return data;
    }

    function migrateTasks(items) {
      return items.map((task, index) => {
        const start = clampMinutes(parseTime(task.time) ?? task.start ?? (9 * 60 + index * 60));
        const taskDuration = clampDuration(Number(task.duration) || DEFAULT_DURATION, start);
        return {
          id: task.id || createId(),
          title: task.title || "未命名日程",
          note: task.note || "",
          time: formatTime(start),
          start,
          duration: taskDuration,
          done: Boolean(task.done),
          important: Boolean(task.important),
          createdAt: task.createdAt || Date.now()
        };
      });
    }

    function createId() {
      return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function parseTime(value) {
      if (!value) return null;
      const match = String(value).match(/^(\d{1,2}):(\d{2})$/);
      if (!match) return null;
      return Number(match[1]) * 60 + Number(match[2]);
    }

    function formatTime(minutes) {
      const safe = Math.max(0, Math.min(DAY_END, Math.round(minutes)));
      const hour = Math.floor(safe / 60);
      const minute = safe % 60;
      return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }

    function formatDuration(minutes) {
      const safe = Math.max(0, Math.round(minutes));
      const hour = Math.floor(safe / 60);
      const minute = safe % 60;
      if (hour && minute) return `${hour}h${minute}min`;
      if (hour) return `${hour}h`;
      return `${minute}min`;
    }

    function parseDuration(value) {
      const raw = String(value || "").trim().toLowerCase().replace(/\s+/g, "");
      if (!raw) return DEFAULT_DURATION;
      if (/^\d+$/.test(raw)) return Number(raw);
      const hour = raw.match(/(\d+(?:\.\d+)?)h/);
      const minute = raw.match(/(\d+)m(?:in)?/);
      let total = 0;
      if (hour) total += Number(hour[1]) * 60;
      if (minute) total += Number(minute[1]);
      return total || DEFAULT_DURATION;
    }

    function formatRange(task) {
      return `${formatTime(task.start)}-${formatTime(task.start + task.duration)} · ${formatDuration(task.duration)}`;
    }

    function snap(minutes) {
      return Math.round(minutes / SNAP_MINUTES) * SNAP_MINUTES;
    }

    function clampMinutes(minutes) {
      return Math.max(DAY_START, Math.min(DAY_END - SNAP_MINUTES, snap(minutes)));
    }

    function clampDuration(minutes, start) {
      const value = Math.max(SNAP_MINUTES, Math.min(240, snap(minutes)));
      return Math.min(value, DAY_END - start);
    }

    function minuteToTop(minutes) {
      return ((minutes - DAY_START) / 60) * HOUR_HEIGHT;
    }

    function yToMinutes(y) {
      return clampMinutes(DAY_START + (y / HOUR_HEIGHT) * 60);
    }

    function sortTasks(items) {
      return [...items].sort((a, b) => {
        if (a.done !== b.done) return Number(a.done) - Number(b.done);
        return a.start - b.start;
      });
    }

    function colorClass(index) {
      return index % 2 === 0 ? "blue" : "pink";
    }

    function bindDuration(range, textInput) {
      range.addEventListener("input", () => {
        textInput.value = formatDuration(Number(range.value));
      });
      textInput.addEventListener("change", () => {
        const start = parseTime(modalTime.value) ?? 9 * 60;
        const clean = clampDuration(parseDuration(textInput.value), start);
        range.value = clean;
        textInput.value = formatDuration(clean);
      });
    }

    function switchDate(dateKey) {
      selectedDateKey = dateKey;
      tasks = migrateTasks(loadTasks(selectedDateKey));
      memos = loadMemos(selectedDateKey);
      lastAllDoneKey = allTasksDone() ? selectedDateKey : "";
      monthPicker.value = selectedDateKey.slice(0, 7);
      yearPicker.value = selectedDateKey.slice(0, 4);
      saveTasks();
      closeTaskModal();
      closeMemoModalPanel();
      render();
      hydrateSelectedDateFromBackend().then(() => render());
    }

    function renderHours() {
      hourRows.innerHTML = "";
      for (let hour = 6; hour < 24; hour += 1) {
        const row = document.createElement("div");
        row.className = "hour-row";
        row.style.top = `${(hour - 6) * HOUR_HEIGHT}px`;
        row.innerHTML = `
          <div class="hour-label">${String(hour).padStart(2, "0")}:00</div>
          <div class="hour-area"></div>
        `;
        hourRows.append(row);
      }
    }

    function render() {
      renderDateText();
      renderDailyQuote();
      renderStats();
      renderList();
      renderMemos();
      renderTimeline();
      renderHistory();
      checkCelebration();
      syncSelectedDateToBackend();
    }

    function renderDateText() {
      const date = new Date(`${selectedDateKey}T00:00:00`);
      const weekday = new Intl.DateTimeFormat("zh-CN", { weekday: "long" }).format(date);
      const todayKey = new Date().toLocaleDateString("sv-SE");
      selectedDateText.textContent = `${selectedDateKey} ${weekday}${selectedDateKey === todayKey ? " · 今天" : ""}`;
    }

    async function renderDailyQuote() {
      const dateKey = selectedDateKey;
      const todayKey = new Date().toLocaleDateString("sv-SE");
      const requestId = ++quoteRequestId;
      const cacheKey = `${QUOTE_STORAGE_PREFIX}${dateKey}`;
      const cached = localStorage.getItem(cacheKey);

      if (cached) {
        try {
          const cachedQuote = JSON.parse(cached);
          if (cachedQuote.fetchedOn === todayKey) {
            setQuote(cachedQuote, dateKey);
            return;
          }
        } catch {
          localStorage.removeItem(cacheKey);
        }
      }

      dailyQuoteText.textContent = "正在从外部语句服务获取今日一句...";
      dailyQuoteSource.textContent = "正在更新";
      dailyQuoteDate.textContent = dateKey;

      try {
        const response = await fetch(QUOTE_ENDPOINT, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (requestId !== quoteRequestId || dateKey !== selectedDateKey) return;

        const quote = {
          text: data.hitokoto || "今天也要稳稳地向前。",
          source: data.from ? `《${data.from}》` : "一言",
          fetchedOn: todayKey
        };
        localStorage.setItem(cacheKey, JSON.stringify(quote));
        setQuote(quote, dateKey);
      } catch {
        if (requestId !== quoteRequestId || dateKey !== selectedDateKey) return;
        setQuote({
          text: "暂时无法连接外部语句服务，稍后再来刷新这一句。",
          source: "外部数据加载失败",
          fetchedOn: todayKey
        }, dateKey);
      }
    }

    function setQuote(quote, dateKey) {
      dailyQuoteText.textContent = `“${quote.text}”`;
      dailyQuoteSource.textContent = quote.source;
      dailyQuoteDate.textContent = dateKey;
    }

    async function syncSelectedDateToBackend() {
      if (!backendReady) return;
      try {
        const response = await fetch("/api/sync/day", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            date: selectedDateKey,
            tasks,
            memos
          })
        });
        if (response.ok) {
          const result = await response.json();
          if (result.day && Array.isArray(result.day.tasks)) {
            tasks = migrateTasks(result.day.tasks);
            localStorage.setItem(keyFor(selectedDateKey), JSON.stringify(tasks));
          }
        }
      } catch {
        backendReady = false;
        showBackendStatus("本地服务连接中断，普通日程已保存在浏览器中。", true);
        // The page can still run as a localStorage-only app when the backend is not active.
      }
    }

    async function hydrateSelectedDateFromBackend() {
      try {
        const response = await fetch(`/api/day?date=${encodeURIComponent(selectedDateKey)}`);
        if (!response.ok) return;
        const day = await response.json();
        if (Array.isArray(day.tasks) && day.tasks.length && !tasks.length) {
          tasks = migrateTasks(day.tasks);
          localStorage.setItem(keyFor(selectedDateKey), JSON.stringify(tasks));
        }
        if (Array.isArray(day.memos) && day.memos.length && !memos.length) {
          memos = day.memos;
          localStorage.setItem(memoKeyFor(selectedDateKey), JSON.stringify(memos));
        }
      } catch {
        // Offline/static mode keeps using browser localStorage.
      }
    }

    function renderStats() {
      const done = tasks.filter((task) => task.done).length;
      const open = tasks.length - done;
      const minutes = tasks.reduce((sum, task) => sum + task.duration, 0);
      totalCount.textContent = tasks.length;
      openCount.textContent = open;
      doneCount.textContent = done;
      statusText.textContent = tasks.length ? `${open} 个待完成，${done} 个已完成，共 ${formatDuration(minutes)}` : "还没有日程";
    }

    function renderList() {
      const sortedTasks = sortTasks(tasks);
      if (!tasks.length) {
        list.innerHTML = `
          <li class="empty">
            <strong>这一天还很清爽</strong>
            添加第一条日程，让这一天有个稳稳的安排。
          </li>
        `;
        return;
      }

      list.innerHTML = "";
      sortedTasks.forEach((task, index) => {
        const item = document.createElement("li");
        item.className = `task ${colorClass(index)}${task.done ? " done" : ""}${task.important ? " important" : ""}`;
        item.dataset.id = task.id;

        const checkbox = document.createElement("button");
        checkbox.className = "checkbox";
        checkbox.type = "button";
        checkbox.setAttribute("aria-label", task.done ? "标记为未完成" : "标记为完成");
        checkbox.textContent = task.done ? "✿" : "";
        checkbox.addEventListener("click", () => toggleTask(task.id));

        const content = document.createElement("div");
        const time = document.createElement("span");
        time.className = "time";
        time.textContent = formatRange(task);

        const title = document.createElement("p");
        title.className = "title";
        title.textContent = task.title;
        content.append(time, title);

        if (task.note) {
          const note = document.createElement("p");
          note.className = "note";
          note.textContent = task.note;
          content.append(note);
        }

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const edit = document.createElement("button");
        edit.className = "icon-btn edit";
        edit.type = "button";
        edit.setAttribute("aria-label", "编辑日程");
        edit.textContent = "✎";
        edit.addEventListener("click", () => openModal(task));

        const remove = document.createElement("button");
        remove.className = "icon-btn delete";
        remove.type = "button";
        remove.setAttribute("aria-label", "删除日程");
        remove.textContent = "×";
        remove.addEventListener("click", () => deleteTask(task.id));

        actions.append(edit, remove);
        item.append(checkbox, content, actions);
        list.append(item);
      });
    }

    function renderMemos() {
      memoStatusText.textContent = memos.length ? `${memos.length} 条随记` : "写下今天的片刻想法";
      openMemoButton.textContent = memos.length ? "继续记录一个想法" : "点击记录一个想法";
      memoList.innerHTML = "";

      memos.forEach((memo) => {
        const card = document.createElement("article");
        card.className = "memo-card";

        const meta = document.createElement("span");
        meta.className = "memo-meta";
        meta.textContent = new Intl.DateTimeFormat("zh-CN", {
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(memo.createdAt));

        const text = document.createElement("p");
        text.className = "memo-text";
        text.textContent = memo.text;

        card.append(meta, text);
        memoList.append(card);
      });
    }

    function allTasksDone() {
      return tasks.length > 0 && tasks.every((task) => task.done);
    }

    function checkCelebration() {
      const doneNow = allTasksDone();
      if (doneNow && lastAllDoneKey !== selectedDateKey) {
        showCelebration();
        lastAllDoneKey = selectedDateKey;
      }
      if (!doneNow && lastAllDoneKey === selectedDateKey) {
        lastAllDoneKey = "";
      }
    }

    function showCelebration() {
      celebration.innerHTML = '<div class="celebration-message">今天的日程全部完成</div>';
      for (let index = 0; index < 34; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.setProperty("--drift", `${Math.random() * 180 - 90}px`);
        piece.style.animationDelay = `${Math.random() * 0.38}s`;
        celebration.append(piece);
      }
      celebration.classList.add("show");
      window.setTimeout(() => {
        celebration.classList.remove("show");
        celebration.innerHTML = "";
      }, 2400);
    }

    function renderTimeline() {
      hideTimelineTooltip();
      eventLayer.innerHTML = "";
      sortTasks(tasks).forEach((task, index) => {
        const block = document.createElement("div");
        block.className = `event-block ${colorClass(index)}${task.done ? " done" : ""}${task.important ? " important" : ""}`;
        block.dataset.id = task.id;
        block.dataset.tooltip = timelineTooltipText(task);
        block.setAttribute("aria-label", timelineTooltipText(task));
        block.tabIndex = 0;
        block.style.top = `${minuteToTop(task.start)}px`;
        block.style.height = `${Math.max(42, (task.duration / 60) * HOUR_HEIGHT)}px`;
        block.innerHTML = `
          <span class="resize-handle resize-top" data-resize="top"></span>
          <div class="event-content">
            <span class="event-title"></span>
            <span class="event-time"></span>
            <span class="event-note"></span>
          </div>
          <span class="resize-handle resize-bottom" data-resize="bottom"></span>
        `;
        block.querySelector(".event-title").textContent = task.title;
        block.querySelector(".event-time").textContent = formatRange(task);
        block.querySelector(".event-note").textContent = task.note || "无备注";
        block.addEventListener("mouseenter", showTimelineTooltip);
        block.addEventListener("focus", showTimelineTooltip);
        block.addEventListener("mouseleave", hideTimelineTooltip);
        block.addEventListener("blur", hideTimelineTooltip);
        block.addEventListener("pointerdown", startTimelinePointer);
        eventLayer.append(block);
      });
    }

    function timelineTooltipText(task) {
      return `${task.title}\n${formatRange(task)}\n${task.note || "无备注"}`;
    }

    function isTimelineTextClipped(block) {
      const content = block.querySelector(".event-content");
      const title = block.querySelector(".event-title");
      const time = block.querySelector(".event-time");
      const note = block.querySelector(".event-note");
      return [content, title, time, note].some((node) => (
        node && (node.scrollWidth > node.clientWidth || node.scrollHeight > node.clientHeight)
      ));
    }

    function showTimelineTooltip(event) {
      const block = event.currentTarget;
      if (!isTimelineTextClipped(block)) {
        hideTimelineTooltip();
        return;
      }

      timelineTooltip.textContent = block.dataset.tooltip || "";
      timelineTooltip.classList.add("is-visible");

      const rect = block.getBoundingClientRect();
      const tooltipRect = timelineTooltip.getBoundingClientRect();
      const gap = 12;
      const rightX = rect.right + gap;
      const leftX = rect.left - tooltipRect.width - gap;
      const canOpenRight = rightX + tooltipRect.width <= window.innerWidth - 16;
      const left = canOpenRight ? rightX : Math.max(16, leftX);
      const top = Math.min(
        window.innerHeight - tooltipRect.height / 2 - 16,
        Math.max(16 + tooltipRect.height / 2, rect.top + rect.height / 2)
      );

      timelineTooltip.style.left = `${left}px`;
      timelineTooltip.style.top = `${top}px`;
    }

    function hideTimelineTooltip() {
      timelineTooltip.classList.remove("is-visible");
    }

    function summarize(items) {
      return {
        total: items.length,
        done: items.filter((item) => item.done).length,
        duration: items.reduce((sum, item) => sum + item.duration, 0)
      };
    }

    function renderHistory() {
      const allData = getAllDailyData();
      const monthKey = monthPicker.value || selectedDateKey.slice(0, 7);
      const yearKey = String(yearPicker.value || selectedDateKey.slice(0, 4));
      const monthItems = Object.entries(allData)
        .filter(([dateKey]) => dateKey.startsWith(monthKey))
        .flatMap(([, dayTasks]) => dayTasks);
      const yearItems = Object.entries(allData)
        .filter(([dateKey]) => dateKey.startsWith(`${yearKey}-`))
        .flatMap(([, dayTasks]) => dayTasks);
      const monthSummary = summarize(monthItems);
      const yearSummary = summarize(yearItems);

      monthTotal.textContent = monthSummary.total;
      monthDone.textContent = monthSummary.done;
      monthDuration.textContent = formatDuration(monthSummary.duration);
      yearTotal.textContent = yearSummary.total;
      yearDone.textContent = yearSummary.done;
      yearDuration.textContent = formatDuration(yearSummary.duration);

      renderCalendar(allData, monthKey);
      renderYearBars(allData, yearKey);
    }

    function renderCalendar(allData, monthKey) {
      calendarGrid.innerHTML = "";
      ["一", "二", "三", "四", "五", "六", "日"].forEach((day) => {
        const cell = document.createElement("div");
        cell.className = "weekday";
        cell.textContent = day;
        calendarGrid.append(cell);
      });

      const [year, month] = monthKey.split("-").map(Number);
      const first = new Date(year, month - 1, 1);
      const firstOffset = (first.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month, 0).getDate();

      for (let index = 0; index < firstOffset; index += 1) {
        const blank = document.createElement("div");
        blank.className = "day-cell muted";
        calendarGrid.append(blank);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const dateKey = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const dayTasks = allData[dateKey] || [];
        const button = document.createElement("button");
        button.type = "button";
        button.className = `day-cell${dayTasks.length ? " has-data" : ""}${dateKey === selectedDateKey ? " selected" : ""}`;
        button.innerHTML = `<span>${day}</span>${dayTasks.length ? `<span class="count">${dayTasks.length}</span>` : ""}`;
        button.addEventListener("click", () => switchDate(dateKey));
        calendarGrid.append(button);
      }
    }

    function renderYearBars(allData, yearKey) {
      const monthlyTotals = Array.from({ length: 12 }, (_, index) => {
        const prefix = `${yearKey}-${String(index + 1).padStart(2, "0")}`;
        return Object.entries(allData)
          .filter(([dateKey]) => dateKey.startsWith(prefix))
          .reduce((sum, [, dayTasks]) => sum + dayTasks.length, 0);
      });
      const max = Math.max(1, ...monthlyTotals);
      yearBars.innerHTML = "";
      monthlyTotals.forEach((total, index) => {
        const row = document.createElement("div");
        row.className = "year-row";
        row.innerHTML = `
          <span>${monthNames[index]}</span>
          <div class="bar"><span style="width:${(total / max) * 100}%"></span></div>
          <span>${total}</span>
        `;
        yearBars.append(row);
      });
    }

    function createTaskFromValues(values) {
      const start = clampMinutes(parseTime(values.time) ?? 9 * 60);
      const taskDuration = clampDuration(Number(values.duration) || DEFAULT_DURATION, start);
      return {
        id: createId(),
        title: values.title,
        note: values.note || "",
        start,
        time: formatTime(start),
        duration: taskDuration,
        done: Boolean(values.done),
        important: Boolean(values.important),
        createdAt: Date.now()
      };
    }

    monthPicker.addEventListener("change", () => {
      if (!monthPicker.value) return;
      yearPicker.value = monthPicker.value.slice(0, 4);
      renderHistory();
    });

    yearPicker.addEventListener("change", renderHistory);
    todayButton.addEventListener("click", () => switchDate(new Date().toLocaleDateString("sv-SE")));
    backendRetryButton.addEventListener("click", () => checkBackendReadiness());

    timelineClickLayer.addEventListener("click", (event) => {
      if (event.target !== timelineClickLayer) return;
      const rect = timelineClickLayer.getBoundingClientRect();
      const minutes = yToMinutes(event.clientY - rect.top);
      openModal(null, minutes);
    });

    function startTimelinePointer(event) {
      if (event.button !== 0) return;
      hideTimelineTooltip();
      const block = event.currentTarget;
      const task = tasks.find((item) => item.id === block.dataset.id);
      if (!task) return;

      const handle = event.target.closest("[data-resize]");
      activePointer = {
        id: task.id,
        mode: handle ? handle.dataset.resize : "move",
        startY: event.clientY,
        originalStart: task.start,
        originalDuration: task.duration,
        moved: false
      };

      block.setPointerCapture(event.pointerId);
      block.addEventListener("pointermove", moveTimelinePointer);
      block.addEventListener("pointerup", endTimelinePointer, { once: true });
      block.addEventListener("pointercancel", endTimelinePointer, { once: true });
      event.preventDefault();
    }

    function moveTimelinePointer(event) {
      if (!activePointer) return;
      const task = tasks.find((item) => item.id === activePointer.id);
      if (!task) return;

      const deltaMinutes = snap(((event.clientY - activePointer.startY) / HOUR_HEIGHT) * 60);
      if (Math.abs(deltaMinutes) >= SNAP_MINUTES) activePointer.moved = true;

      if (activePointer.mode === "move") {
        task.start = Math.max(DAY_START, Math.min(DAY_END - task.duration, activePointer.originalStart + deltaMinutes));
      }

      if (activePointer.mode === "top") {
        const latestStart = activePointer.originalStart + activePointer.originalDuration - SNAP_MINUTES;
        const nextStart = Math.max(DAY_START, Math.min(latestStart, activePointer.originalStart + deltaMinutes));
        task.start = nextStart;
        task.duration = activePointer.originalDuration + activePointer.originalStart - nextStart;
      }

      if (activePointer.mode === "bottom") {
        task.duration = clampDuration(activePointer.originalDuration + deltaMinutes, task.start);
      }

      task.start = snap(task.start);
      task.duration = clampDuration(task.duration, task.start);
      task.time = formatTime(task.start);

      const block = event.currentTarget;
      block.style.top = `${minuteToTop(task.start)}px`;
      block.style.height = `${Math.max(42, (task.duration / 60) * HOUR_HEIGHT)}px`;
      block.querySelector(".event-time").textContent = formatRange(task);
    }

    function endTimelinePointer(event) {
      const clickedId = activePointer && !activePointer.moved && activePointer.mode === "move" ? activePointer.id : null;
      event.currentTarget.removeEventListener("pointermove", moveTimelinePointer);
      saveTasks();
      activePointer = null;
      render();
      if (clickedId) {
        const task = tasks.find((item) => item.id === clickedId);
        if (task) openModal(task);
      }
    }

    function toggleTask(id) {
      tasks = tasks.map((task) => task.id === id ? { ...task, done: !task.done } : task);
      saveTasks();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter((task) => task.id !== id);
      saveTasks();
      closeTaskModal();
      render();
    }

    function openModal(task, startMinutes = 9 * 60, options = {}) {
      const isEdit = Boolean(task);
      modalTitle.textContent = isEdit ? "编辑日程" : "新增日程";
      modalTaskId.value = task ? task.id : "";
      modalTime.value = options.blankTime && !isEdit ? "" : formatTime(task ? task.start : startMinutes);
      modalDuration.value = task ? task.duration : DEFAULT_DURATION;
      modalDurationText.value = formatDuration(task ? task.duration : DEFAULT_DURATION);
      modalTaskTitle.value = task ? task.title : "";
      modalNote.value = task ? task.note : "";
      modalForm.dataset.important = options.important ? "1" : "";
      modalDoneToggle.textContent = task && task.done ? "取消完成" : "标记完成";
      modalDoneToggle.style.display = isEdit ? "block" : "none";
      modalDelete.style.display = isEdit ? "block" : "none";
      modalActions.classList.toggle("with-delete", isEdit);
      modalBackdrop.classList.add("open");
      setTimeout(() => modalTaskTitle.focus(), 0);
    }

    function closeTaskModal() {
      modalBackdrop.classList.remove("open");
      modalForm.reset();
      modalForm.dataset.important = "";
      if (taskModalResolver) {
        taskModalResolver("cancelled");
        taskModalResolver = null;
      }
    }

    function openMemoModal() {
      memoText.value = "";
      memoBackdrop.classList.add("open");
      setTimeout(() => memoText.focus(), 0);
    }

    function closeMemoModalPanel() {
      memoBackdrop.classList.remove("open");
      memoForm.reset();
    }

    modalForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = modalTaskTitle.value.trim();
      if (!title) return;

      const parsedStart = parseTime(modalTime.value);
      if (parsedStart === null) {
        modalTime.setCustomValidity("请选择开始时间");
        modalTime.reportValidity();
        return;
      }
      modalTime.setCustomValidity("");
      const start = clampMinutes(parsedStart);
      const taskDuration = clampDuration(parseDuration(modalDurationText.value), start);
      const id = modalTaskId.value;
      const note = modalNote.value.trim();

      if (id) {
        tasks = tasks.map((task) => task.id === id ? {
          ...task,
          title,
          note,
          start,
          time: formatTime(start),
          duration: taskDuration,
          important: Boolean(task.important)
        } : task);
      } else {
        tasks.push(createTaskFromValues({
          title,
          note,
          time: formatTime(start),
          duration: taskDuration,
          important: modalForm.dataset.important === "1"
        }));
      }

      saveTasks();
      const resolver = taskModalResolver;
      taskModalResolver = null;
      closeTaskModal();
      render();
      if (resolver) resolver("saved");
    });

    openMemoButton.addEventListener("click", openMemoModal);

    memoForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = memoText.value.trim();
      if (!text) return;

      memos.unshift({
        id: createId(),
        text,
        createdAt: Date.now()
      });
      saveMemos();
      closeMemoModalPanel();
      renderMemos();
      syncSelectedDateToBackend();
    });

    clearMemoButton.addEventListener("click", () => {
      memoText.value = "";
      memoText.focus();
    });

    closeMemoModal.addEventListener("click", closeMemoModalPanel);
    memoBackdrop.addEventListener("click", (event) => {
      if (event.target === memoBackdrop) closeMemoModalPanel();
    });

    modalDoneToggle.addEventListener("click", () => {
      if (!modalTaskId.value) return;
      toggleTask(modalTaskId.value);
      const task = tasks.find((item) => item.id === modalTaskId.value);
      if (task) openModal(task);
    });

    modalDelete.addEventListener("click", () => {
      if (modalTaskId.value) deleteTask(modalTaskId.value);
    });

    closeModal.addEventListener("click", closeTaskModal);
    modalBackdrop.addEventListener("click", (event) => {
      if (event.target === modalBackdrop) closeTaskModal();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modalBackdrop.classList.contains("open")) closeTaskModal();
      if (event.key === "Escape" && memoBackdrop.classList.contains("open")) closeMemoModalPanel();
      if (event.key === "Escape" && dailyReminderBackdrop.classList.contains("open")) dailyReminderClose.click();
    });
    document.addEventListener("visibilitychange", sendSessionHeartbeat);
    window.addEventListener("pagehide", () => {
      if (!navigator.sendBeacon) return;
      const closeBody = JSON.stringify({
        sessionId,
        date: selectedDateKey
      });
      navigator.sendBeacon("/api/session/closing-intent", closeBody);
      const heartbeatBody = JSON.stringify({
        sessionId,
        date: selectedDateKey,
        visibility: "hidden"
      });
      navigator.sendBeacon("/api/session/heartbeat", heartbeatBody);
    });
  </script>
</body>
</html>
