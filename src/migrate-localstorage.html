<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>迁移个人日程数据</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eff8ff, #fff3fa);
      color: #1f2d3d;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    main {
      width: min(560px, calc(100% - 32px));
      padding: 24px;
      border: 1px solid rgba(159, 215, 255, 0.34);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 42px rgba(38, 48, 58, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    p {
      margin: 8px 0;
      color: #657487;
      line-height: 1.6;
    }

    button {
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #4f9fd7, #78bff0);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      padding: 11px 14px;
    }

    pre {
      margin-top: 16px;
      max-height: 220px;
      overflow: auto;
      border-radius: 8px;
      background: #f7fafc;
      padding: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>迁移旧快捷方式数据</h1>
    <p>这个页面会读取原 file:// 快捷方式下的 localStorage，并导入到当前本地后端。</p>
    <p>导入后，桌面快捷方式可以统一指向 http://127.0.0.1:5173/。</p>
    <button id="migrateButton" type="button">开始迁移</button>
    <pre id="result">等待开始...</pre>
  </main>

  <script>
    const result = document.querySelector("#result");
    const button = document.querySelector("#migrateButton");
    const endpoint = "http://127.0.0.1:5173/api/import/localstorage";

    function collectData() {
      const days = {};
      for (let index = 0; index < localStorage.length; index += 1) {
        const key = localStorage.key(index);
        if (!key) continue;

        if (key.startsWith("daily-schedule:")) {
          const date = key.replace("daily-schedule:", "");
          days[date] = days[date] || {};
          days[date].tasks = JSON.parse(localStorage.getItem(key) || "[]");
        }

        if (key.startsWith("daily-memos:")) {
          const date = key.replace("daily-memos:", "");
          days[date] = days[date] || {};
          days[date].memos = JSON.parse(localStorage.getItem(key) || "[]");
        }
      }
      return { days };
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "正在迁移...";
      try {
        const payload = collectData();
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = `迁移失败：${error.message}\n请确认 http://127.0.0.1:5173/ 后端服务已经启动。`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
